<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
        <div class="logo-cabecalho">
             <img src="./assets/images/logo-tech-match.png" class="logo-rodape" alt="Logo TechMatch">
        </div>

    <section class="menu-personalizacao">
            <img src="./assets/icons/coracao-preenchido.svg" class="coracao-preenchido" alt="Coração Preenchido">
            <img src="./assets/icons/coracao-vazado.svg" class="coracao-vazado" alt="Coração Vazio">
            <h3 class="titulo-inicial">Dados Pessoais</h3>

            <main class="acesso">
                <h1 class="criar-conta">Crie sua conta</h1>

                <form action="#" method="post">

                    <label>Nome Completo</label>
                        <input type="text" name="nome-completo">
                    <label>Email Institucional</label>
                        <input type="email" name="email-institucional">
                    <label>Digite sua senha</label>
                        <input type="password" name="digite-sua-senha">

                    <h5 class="sua-senha-deve-ter">Sua senha deve ter:</h5>
                        <ul>
                            <li class="descricao-senha">No mínimo 8 caracteres</li>
                            <li class="descricao-senha">Pelo menos um caractere especial</li>
                            <li class="descricao-senha">Pelo menos um número</li>
                        </ul>
                    
                    <input type="checkbox" id="check-termos" disabled>
                        <label for="check-termos">
                            Li e aceito os <a href="#" id="abrir-modal">termos de uso</a>.
                        </label>
    </section>
        
    <button type="submit" class="botao-entrar-cadastrar">Cadastrar</button>
</body>
</html>
