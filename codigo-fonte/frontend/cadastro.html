<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header class="inicio-cabeçalho">
    <div class="logo-cabeçalho">
        <img src="./assets/images/logo-tech-match.png" alt="Logo TechMatch">
    </div>

    <img src="./assets/icons/coracao-preenchido.svg" alt="Coração Preenchido">
    <img src="./assets/icons/coracao-vazado.svg" alt="Coração Vazio">

    <h3 class="titulo-inicial">Dados Pessoais</h3>
</header>

<main class="acesso">

    <h1 class="criar-conta">Crie sua conta</h1>

    <form action="#" method="post">

        <h3 class="nome-completo">Nome Completo</h3>
        <input type="text" name="nome-completo">

        <h3 class="email-institucional">Email Institucional</h3>
        <input type="email" name="email-institucional">

        <h3 class="digite-sua-senha">Digite sua senha</h3>
        <input type="password" name="digite-sua-senha">

        <h5 class="sua-senha-deve-ter">Sua senha deve ter:</h5>
        <h5 class="caracteres">No mínimo 8 caracteres</h5>
        <h5 class="caracteres-especial">Pelo menos um caractere especial</h5>
        <h5 class="numero">Pelo menos um número</h5>

        <input type="checkbox">
        Aceitar termos de uso

        <button type="submit" class="botao-entrar">Cadastrar</button>

    </form>

</main>
